name: Build DangKhoi Tool 1.0 CFG

"on":
  push:
    branches: [main, master]
    paths:
      - "DangKhoi-Tool-iPhone-1.0-CFG.zip"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source archive
        shell: bash
        run: |
          test -f DangKhoi-Tool-iPhone-1.0-CFG.zip
          mkdir -p ios-build-source
          unzip -q DangKhoi-Tool-iPhone-1.0-CFG.zip -d ios-build-source
          test -f ios-build-source/VNBAPEXTool/project.yml

      - name: Test incremental dump parser and 100 MiB boundary
        shell: bash
        run: |
          node ios-build-source/VNBAPEXTool/Tests/parser.test.cjs
          node ios-build-source/VNBAPEXTool/Tests/relations.test.cjs
          node ios-build-source/VNBAPEXTool/Tests/deep-analysis.test.cjs
          node ios-build-source/VNBAPEXTool/Tests/import-v7.test.cjs
          node ios-build-source/VNBAPEXTool/Tests/focus.test.cjs
          node ios-build-source/VNBAPEXTool/Tests/focus-ui.test.cjs
          node ios-build-source/VNBAPEXTool/Tests/deep-v9.test.cjs
          node ios-build-source/VNBAPEXTool/Tests/machine-v10.test.cjs
          node ios-build-source/VNBAPEXTool/Tests/signatures-v10.test.cjs
          node ios-build-source/VNBAPEXTool/Tests/patch-v11.test.cjs
          node ios-build-source/VNBAPEXTool/Tests/patch-ui-v11.test.cjs
          node ios-build-source/VNBAPEXTool/Tests/cfg-v12.test.cjs

      - name: Test native patch engine
        shell: bash
        run: |
          swiftc ios-build-source/VNBAPEXTool/App/PatchEngine.swift ios-build-source/VNBAPEXTool/Tests/PatchEngineTests.swift -o "$RUNNER_TEMP/patch-engine-tests"
          "$RUNNER_TEMP/patch-engine-tests"

      - name: Install XcodeGen
        shell: bash
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          cd ios-build-source/VNBAPEXTool
          xcodegen generate --spec project.yml

      - name: Build ARM64 device application
        shell: bash
        run: |
          cd ios-build-source/VNBAPEXTool
          set -o pipefail
          xcodebuild \
            -project iOSOffsetDesk.xcodeproj \
            -scheme iOSOffsetDesk \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/offsetdesk-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            build 2>&1 | tee "$GITHUB_WORKSPACE/xcode-build.log"

      - name: Verify app and package unsigned IPA
        shell: bash
        run: |
          APP_PATH="$RUNNER_TEMP/offsetdesk-derived/Build/Products/Release-iphoneos/iOSOffsetDesk.app"
          test -f "$APP_PATH/iOSOffsetDesk"
          test -f "$APP_PATH/Web/index.html"
          test -f "$APP_PATH/Web/core.js"
          test -f "$APP_PATH/Web/ios-bridge.js"
          test -f "$APP_PATH/Web/dump-ui.js"
          test -f "$APP_PATH/Web/dump-stream.js"
          test -f "$APP_PATH/Web/evidence.js"
          test -f "$APP_PATH/Web/analysis-ui.js"
          test -f "$APP_PATH/Web/relations.js"
          test -f "$APP_PATH/Web/assessment.js"
          test -f "$APP_PATH/Web/focus.js"
          test -f "$APP_PATH/Web/fingerprints.js"
          test -f "$APP_PATH/Web/machine.js"
          test -f "$APP_PATH/Web/signatures.js"
          test -f "$APP_PATH/Web/patch.js"
          test -f "$APP_PATH/Web/patch-ui.js"
          test -f "$APP_PATH/Web/music-ui.js"
          test -f "$APP_PATH/Web/cfg.js"
          test -f "$APP_PATH/Web/avatar.png"
          test -f "$APP_PATH/background.mp3"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")" = "DangKhoi Tool"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "1.0"
          test -f "$APP_PATH/Web/focus-ui.js"
          test -f "$APP_PATH/Web/theme.css"
          test -f "$APP_PATH/Web/brand.svg"
          file "$APP_PATH/iOSOffsetDesk"
          mkdir -p "$RUNNER_TEMP/offsetdesk-package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/offsetdesk-package/Payload/"
          cd "$RUNNER_TEMP/offsetdesk-package"
          /usr/bin/zip -q -r "$GITHUB_WORKSPACE/DangKhoi-Tool-1.0-CFG-unsigned.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/DangKhoi-Tool-1.0-CFG-unsigned.ipa"

      - name: Upload IPA and build instructions
        uses: actions/upload-artifact@v4
        with:
          name: DangKhoi-Tool-1.0-CFG-unsigned-IPA
          path: |
            DangKhoi-Tool-1.0-CFG-unsigned.ipa
            ios-build-source/VNBAPEXTool/HUONG-DAN-IPHONE.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DangKhoi-Tool-1.0-CFG-build-log
          path: xcode-build.log
          if-no-files-found: ignore
          retention-days: 14
